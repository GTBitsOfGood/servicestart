name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate-db:
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Install dependencies
        run: pnpm install

      - name: Check migrations
        run: pnpm run db:check

      - name: Load DB_URL from secrets
        run: echo "DB_URL=${{ secrets.DB_URL }}" >> $GITHUB_ENV

      - name: Generate DB migrations
        run: pnpm run db:generate

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[Actions] Generate database migrations"
          branch: main
          file_pattern: "drizzle/**"

      - name: Run database migrations
        run: pnpm run db:migrate
