name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Create test database
        run: pnpm run db:test:create

      - name: Run tests
        run: pnpm test
  e2e:
    name: E2E Test - shard ${{ matrix.shard }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardTotal: [8]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database
        run: pnpm run db:test:create

      - name: Migrate test database
        run: pnpm run db:test:migrate

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ matrix.shardTotal }})
        run: CI=true pnpm run test:e2e --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}-of-${{ matrix.shardTotal }}
          path: playwright-report/
          retention-days: 30

  e2e-all:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Log
        run: echo "All E2E test shards completed successfully."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Check code format
        run: pnpm format

  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Check migrations
        run: pnpm run db:check

      - name: Create database
        run: pnpm run db:create

      - name: Migrate database
        run: DB_URL=postgres://dev:root@localhost:5432/postgres pnpm run db:migrate
